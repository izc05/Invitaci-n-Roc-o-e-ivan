<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Gracias por confirmar · Iván y Rocío</title>
  <style>
    :root{color-scheme:light}
    *{box-sizing:border-box}
    body{margin:0;min-height:100svh;display:grid;place-items:center;padding:22px;background:linear-gradient(150deg,#e8ddd1,#f8f2e9);font-family:Georgia,serif;color:#332d28}
    main{width:min(100%,600px);padding:clamp(30px,6vw,60px) 24px;text-align:center;border:1px solid rgba(85,69,50,.12);border-radius:28px;background:#fffaf4;box-shadow:0 24px 70px rgba(64,51,39,.1)}
    small{font:700 10px/1.5 Arial,sans-serif;color:#857057;letter-spacing:.25em;text-transform:uppercase}
    h1{font-size:clamp(38px,8vw,58px);font-weight:400;margin:18px 0;color:#405448}
    p{font:400 17px/1.7 Georgia,serif;color:#655c52;max-width:480px;margin:0 auto}
    a{display:inline-block;margin-top:30px;background:#405448;color:white;padding:16px 27px;border-radius:999px;text-decoration:none;font:700 12px/1.5 Arial,sans-serif;letter-spacing:.07em}
    a:focus-visible{outline:3px solid #c9a56f;outline-offset:4px}
  </style>
</head>
<body>
  <main>
    <small>Boda · 27 de febrero de 2027</small>
    <h1>¡Gracias de corazón! ♡</h1>
    <p>El servicio de confirmaciones ha procesado tu formulario. Iván y Rocío recibirán las respuestas en su correo cuando el servicio las entregue.</p>
    <a href="./#rsvp">Volver a la invitación</a>
  </main>
</body>
</html>
